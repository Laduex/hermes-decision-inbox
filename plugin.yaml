manifest_version: 2
api_version: 1
name: hermes-decision-inbox
version: 0.3.0
description: Private Hermes session decisions and weekly Memory Wiki review publishing for Tailscale.
author: Vaughn Dazo, Hermes Agent
license: MIT
kind: standalone
platforms:
  - linux
  - macos
provides_tools:
  - publish_weekly_wiki_review
  - publish_decision
  - read_decisions
python_dependencies:
  - httpx>=0.27,<1
config_schema:
  service_url:
    type: str
    default: http://decision-inbox:8080
    description: Internal URL of the Decision Inbox service.
  default_expiry_days:
    type: int
    default: 14
  auto_resume:
    type: bool
    default: true
  wiki_executor_enabled:
    type: bool
    default: true
  general_decisions_enabled:
    type: bool
    default: true
  session_delivery_enabled:
    type: bool
    default: true
    description: Claim and inject continuations for verified live Hermes conversations.
  continuation_poll_seconds:
    type: float
    default: 2.0
    description: Poll interval for queued conversation continuations.
tags: [tailscale, wiki, review, workflow]

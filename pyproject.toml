[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-decision-inbox"
version = "0.3.4"
description = "Private, session-aware Decision Inbox for Hermes tasks and weekly Wiki reviews"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vaughn Dazo, Hermes Agent" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[project.scripts]
decision-inbox = "hermes_decision_inbox.cli:main"

[project.entry-points."hermes_agent.plugins"]
hermes-decision-inbox = "hermes_decision_inbox.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_decision_inbox", "service"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "hermes_decision_inbox/skills"
"plugin.yaml" = "hermes_decision_inbox/plugin.yaml"

[tool.pytest.ini_options]
testpaths = ["tests", "web/tests"]
asyncio_mode = "auto"
